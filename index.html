  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Meridian — Hunter Routine OS</title>
    <meta
      name="description"
      content="Offline-ready iPhone habit tracker, Solo Leveling progression system, calendar manager, and AI mentor for V.V.P. Engineering College IT students."
    />
    <meta name="theme-color" content="#070B14" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Meridian" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta property="og:title" content="Meridian — Hunter Routine OS" />
    <meta
      property="og:description"
      content="Offline-ready iPhone habit tracker, Solo Leveling progression system, calendar manager, and AI mentor."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Rajdhani:wght@500;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Rajdhani:wght@500;600;700&display=swap"
        rel="stylesheet"
      />
    </noscript>
  </head>
  <body class="bg-[#F4F6FA] dark:bg-[#050811] text-slate-900 dark:text-slate-100 antialiased selection:bg-sky-500 selection:text-white">
    <div id="root">
      <div
        id="meridian-boot-shell"
        style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#050811;color:#e2e8f0;"
      >
        <div style="max-width:340px;width:100%;padding:20px;border-radius:10px;border:1px solid rgba(56,189,248,0.35);background:rgba(8,14,30,0.92);">
          <div style="font-size:11px;letter-spacing:0.18em;text-transform:uppercase;color:#38bdf8;font-weight:700;">
            [ MERIDIAN SYSTEM OS ]
          </div>
          <div style="margin-top:8px;font-size:16px;font-weight:700;color:#f8fafc;">
            Initializing Hunter Routine...
          </div>
          <div id="meridian-boot-status" style="margin-top:6px;font-size:12px;color:#94a3b8;">
            Preparing local storage, habits, and AI mentor
          </div>
          <button
            id="meridian-reset-btn"
            type="button"
            onclick="window.__meridianResetCache && window.__meridianResetCache()"
            style="display:none;margin:14px auto 0;padding:10px 14px;border-radius:6px;border:1px solid rgba(56,189,248,0.5);background:#0284c7;color:#ffffff;font-size:12px;font-weight:700;cursor:pointer;"
          >
            Reset Offline Cache &amp; Reload
          </button>
        </div>
      </div>
    </div>
    <script>
      (function () {
        window.__meridianResetCache = function () {
          try {
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function (regs) {
                regs.forEach(function (r) { r.unregister(); });
              });
            }
            if ('caches' in window) {
              caches.keys().then(function (keys) {
                return Promise.all(keys.map(function (k) { return caches.delete(k); }));
              }).finally(function () { window.location.reload(); });
              return;
            }
          } catch (e) {}
          window.location.reload();
        };
        function showBootRecovery(msg) {
          var statusEl = document.getElementById('meridian-boot-status');
          var btnEl = document.getElementById('meridian-reset-btn');
          if (statusEl && msg) statusEl.textContent = msg;
          if (btnEl) btnEl.style.display = 'inline-block';
        }
        window.addEventListener('error', function (ev) {
          if (!window.__MERIDIAN_BOOTED__) {
            showBootRecovery('Startup interrupted: ' + (ev && ev.message ? ev.message : 'Network or cache mismatch.'));
          }
        });
        setTimeout(function () {
          if (!window.__MERIDIAN_BOOTED__) {
            showBootRecovery('Taking longer than expected on this connection.');
          }
        }, 8000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
